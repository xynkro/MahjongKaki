<script>
  // Keep whatever came after /MahjongKaki/ (a room link, a page) when sending people on.

    var rest = location.pathname.replace(/^\/MahjongKaki\/?/, '');

    location.replace('https://mahjongkaki.web.app/' + rest + location.search + location.hash);
  })();
</script>
